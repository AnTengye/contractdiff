<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本截断诊断工具</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        .search-box {
            margin: 20px 0;
        }
        input {
            padding: 10px;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        button:hover {
            background: #45a049;
        }
        .result {
            margin: 20px 0;
            padding: 15px;
            background: #f9f9f9;
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
        }
        .warning {
            border-left-color: #ff9800;
            background: #fff3e0;
        }
        .error {
            border-left-color: #f44336;
            background: #ffebee;
        }
        .paragraph {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }
        .label {
            font-weight: bold;
            color: #666;
            margin-right: 10px;
        }
        .text {
            color: #333;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .highlight {
            background: yellow;
            font-weight: bold;
        }
        pre {
            background: #263238;
            color: #aed581;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 文本截断诊断工具</h1>
        
        <div class="search-box">
            <input type="text" id="searchText" value="展示地图" placeholder="输入要搜索的文本">
            <button onclick="searchInContracts()">🔍 搜索</button>
            <button onclick="checkTruncation()">⚠️ 检查截断</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        const contractIds = [
            '317e85b4-be79-460a-8b93-b95a3881051d',
            '495d2807-bb78-4f71-aab3-6c3ab673ea64'
        ];
        const backendUrl = 'http://127.0.0.1:18080';

        async function fetchContract(contractId) {
            try {
                const response = await fetch(`${backendUrl}/api/contracts/${contractId}/data`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                return await response.json();
            } catch (error) {
                return { error: error.message };
            }
        }

        async function searchInContracts() {
            const searchText = document.getElementById('searchText').value;
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">正在搜索...</div>';

            let allResults = '';

            for (const contractId of contractIds) {
                const data = await fetchContract(contractId);
                
                if (data.error) {
                    allResults += `
                        <div class="result error">
                            <h3>❌ 合同 ${contractId.substring(0, 8)}...</h3>
                            <p>错误: ${data.error}</p>
                            <p>请确保后端服务运行在 ${backendUrl}</p>
                        </div>
                    `;
                    continue;
                }

                let contractResults = `
                    <div class="result">
                        <h3>📄 合同: ${contractId.substring(0, 8)}...</h3>
                        <p class="label">总段落数: ${data.paragraphs?.length || 0}</p>
                `;

                let foundCount = 0;
                
                if (data.paragraphs) {
                    data.paragraphs.forEach((para, index) => {
                        const text = para.text || '';
                        if (text.includes(searchText)) {
                            foundCount++;
                            
                            const highlightedText = text.replace(
                                new RegExp(searchText, 'g'), 
                                `<span class="highlight">${searchText}</span>`
                            );
                            
                            const lastChars = text.slice(-30);
                            const endsWithPunctuation = /[。！？]$/.test(text);
                            
                            contractResults += `
                                <div class="paragraph">
                                    <p><span class="label">段落 ${index}</span> (第 ${para.page} 页)</p>
                                    <p><span class="label">类型:</span> ${para.type}</p>
                                    <p><span class="label">文本长度:</span> ${text.length} 字符</p>
                                    <p><span class="label">最后30字符:</span> "${lastChars}"</p>
                                    <p><span class="label">结尾标点:</span> ${endsWithPunctuation ? '✓ 有' : '⚠️ 无'}</p>
                                    <div class="text">${highlightedText}</div>
                                    ${!endsWithPunctuation ? '<p style="color: #ff9800;">⚠️ 警告: 文本未以句号结尾，可能被截断！</p>' : ''}
                                </div>
                            `;
                        }
                    });
                }

                contractResults += `<p class="label">找到 ${foundCount} 个匹配段落</p></div>`;
                allResults += contractResults;
            }

            resultsDiv.innerHTML = allResults;
        }

        async function checkTruncation() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="result">正在检查截断问题...</div>';

            let allResults = '';

            for (const contractId of contractIds) {
                const data = await fetchContract(contractId);
                
                if (data.error) {
                    allResults += `
                        <div class="result error">
                            <h3>❌ 无法检查合同 ${contractId.substring(0, 8)}...</h3>
                            <p>${data.error}</p>
                        </div>
                    `;
                    continue;
                }

                let suspiciousParagraphs = [];
                
                if (data.paragraphs) {
                    data.paragraphs.forEach((para, index) => {
                        const text = para.text || '';
                        
                        // 检查可疑的截断特征
                        const isSuspicious = 
                            (text.length > 20 && !/[。！？]$/.test(text)) || // 较长文本但无句号结尾
                            /[a-zA-Z]$/.test(text) || // 以英文字母结尾
                            /\d$/.test(text) || // 以数字结尾（可能正常，也可能截断）
                            text.includes('负') && !text.includes('负责'); // 包含"负"但不完整
                        
                        if (isSuspicious) {
                            suspiciousParagraphs.push({
                                index,
                                text,
                                page: para.page,
                                type: para.type,
                                reason: getSuspiciousReason(text)
                            });
                        }
                    });
                }

                allResults += `
                    <div class="result ${suspiciousParagraphs.length > 0 ? 'warning' : ''}">
                        <h3>📋 合同 ${contractId.substring(0, 8)}...</h3>
                        <p class="label">可疑段落: ${suspiciousParagraphs.length}</p>
                `;

                suspiciousParagraphs.forEach(p => {
                    allResults += `
                        <div class="paragraph">
                            <p><span class="label">段落 ${p.index}</span> (第 ${p.page} 页)</p>
                            <p><span class="label">原因:</span> ${p.reason}</p>
                            <p><span class="label">文本长度:</span> ${p.text.length}</p>
                            <p><span class="label">最后50字符:</span> "${p.text.slice(-50)}"</p>
                            <details>
                                <summary>查看完整文本</summary>
                                <div class="text">${p.text}</div>
                            </details>
                        </div>
                    `;
                });

                allResults += '</div>';
            }

            resultsDiv.innerHTML = allResults;
        }

        function getSuspiciousReason(text) {
            const reasons = [];
            
            if (text.length > 20 && !/[。！？]$/.test(text)) {
                reasons.push('无句号结尾');
            }
            if (/[a-zA-Z]$/.test(text)) {
                reasons.push('以英文字母结尾');
            }
            if (text.includes('负') && !text.includes('负责')) {
                reasons.push('包含"负"但可能不完整');
            }
            
            return reasons.join(', ') || '其他可疑特征';
        }

        // 页面加载时自动检查
        window.addEventListener('load', () => {
            checkTruncation();
        });
    </script>
</body>
</html>
