<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 合同比对工具 Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="login-body">
    <div class="login-card glass-panel">
        <div class="header" style="flex-direction: column; gap: 1rem; margin-bottom: 2rem; padding: 0;">
            <div class="logo-container" style="width: 64px; height: 64px;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
            </div>
            <h1 style="text-align: center; font-size: 1.5rem;">欢迎回来</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">请登录以访问智能比对系统</p>
        </div>

        <div class="error-message" id="login-error"
            style="display: none; background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 0.75rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.875rem;">
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="username">账号</label>
                <input type="text" class="form-input" id="username" name="username" placeholder="请输入用户名" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input type="password" class="form-input" id="password" name="password" placeholder="请输入密码" required>
            </div>

            <button type="submit" class="btn btn-primary" id="login-btn" style="width: 100%; margin-top: 1rem;">
                安全登录
            </button>
        </form>
    </div>

    <!-- Vite entry point -->
    <script type="module" src="/src/login.ts"></script>
</body>

</html>
