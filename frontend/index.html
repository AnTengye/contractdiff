<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合同比对工具 Pro</title>
    <meta name="description" content="智能合同文档差异对比工具">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header glass-panel" style="padding: 1rem 2rem; margin-bottom: 0;">
            <div class="header-left">
                <div class="logo-container">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                </div>
                <div class="app-title">
                    <h1>合同比对工具 <span style="font-size: 0.8em; opacity: 0.7; font-weight: 400;">Pro Max</span></h1>
                </div>
            </div>

            <div class="user-controls">
                <div class="user-info" id="user-info" style="display:none;">
                    <div class="user-badge">
                        <div class="user-avatar">U</div>
                        <span id="user-display">User</span>
                    </div>
                    <button class="logout-icon-btn" onclick="logout()" title="退出登录">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content (Sidebar Layout) -->
        <main class="main-layout">
            <!-- Left/Center Workspace -->
            <div class="workspace-main">
                <!-- Upload Section -->
                <section class="upload-section">
                    <div class="upload-grid">
                        <!-- Left Upload -->
                        <div class="upload-card" id="upload-left">
                            <div class="icon-wrapper">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" color="white">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                </svg>
                            </div>
                            <h3>原始合同</h3>
                            <p class="upload-hint">点击或拖拽上传 PDF/DOCX</p>

                            <div class="parser-selector-container">
                                <select id="parser-selector-left" class="parser-selector"
                                    onclick="event.stopPropagation()">
                                    <option value="">加载解析器...</option>
                                </select>
                            </div>

                            <input type="file" id="file-left" accept=".pdf,.docx" hidden>

                            <!-- File Info & Progress -->
                            <div class="file-info" id="info-left"
                                style="margin-top: 1rem; color: var(--success); display: none;"></div>
                            <div class="contract-id" id="contract-id-left"
                                style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;"></div>

                            <div class="progress-wrapper" id="progress-left" style="display:none;">
                                <div class="progress-track">
                                    <div class="progress-fill" id="progress-fill-left"></div>
                                </div>
                                <div class="progress-status">
                                    <span class="status-text" id="progress-text-left">上传中...</span>
                                    <span class="cancel-action" id="cancel-btn-left"
                                        onclick="event.stopPropagation()">取消</span>
                                </div>
                            </div>
                        </div>

                        <!-- Compare Icon (Divider) -->
                        <div class="compare-divider">
                            <div class="compare-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="M17 1l4 4-4 4"></path>
                                    <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                                    <path d="M7 23l-4-4 4-4"></path>
                                    <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                                </svg>
                            </div>
                        </div>

                        <!-- Right Upload -->
                        <div class="upload-card" id="upload-right">
                            <div class="icon-wrapper">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" color="white">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="9" y1="9" x2="15" y2="9"></line>
                                    <line x1="9" y1="15" x2="15" y2="15"></line>
                                </svg>
                            </div>
                            <h3>对比合同</h3>
                            <p class="upload-hint">点击或拖拽上传 PDF/DOCX</p>

                            <div class="parser-selector-container">
                                <select id="parser-selector-right" class="parser-selector"
                                    onclick="event.stopPropagation()">
                                    <option value="">加载解析器...</option>
                                </select>
                            </div>

                            <input type="file" id="file-right" accept=".pdf,.docx" hidden>

                            <div class="file-info" id="info-right"
                                style="margin-top: 1rem; color: var(--success); display: none;"></div>
                            <div class="contract-id" id="contract-id-right"
                                style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;"></div>

                            <div class="progress-wrapper" id="progress-right" style="display:none;">
                                <div class="progress-track">
                                    <div class="progress-fill" id="progress-fill-right"></div>
                                </div>
                                <div class="progress-status">
                                    <span class="status-text" id="progress-text-right">上传中...</span>
                                    <span class="cancel-action" id="cancel-btn-right"
                                        onclick="event.stopPropagation()">取消</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="action-area">
                        <button class="btn btn-primary btn-large" id="compare-btn" disabled>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            开始智能比对
                        </button>
                    </div>
                </section>

                <!-- PDF Section (Primary View) -->
                <section class="pdf-section" id="pdf-section" style="display: none; margin-top: 1rem;">
                    <div class="glass-panel" style="padding: 1rem;">
                        <div class="header" style="margin-bottom: 0.5rem; padding: 0 0.5rem;">
                            <h2>原件视觉比对</h2>
                            <div style="display: flex; gap: 1rem; align-items: center;">
                                <!-- Diff Navigation Controls -->
                                <div class="diff-nav-controls" id="diff-nav-controls" style="display: none;">
                                    <button class="btn btn-ghost btn-sm" id="prev-diff-btn" title="上一个差异 (↑ or K)">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="15 18 9 12 15 6"></polyline>
                                        </svg>
                                    </button>
                                    <span class="diff-counter" id="diff-counter">0 / 0</span>
                                    <button class="btn btn-ghost btn-sm" id="next-diff-btn" title="下一个差异 (↓ or J)">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <polyline points="9 18 15 12 9 6"></polyline>
                                        </svg>
                                    </button>
                                </div>
                                <div class="zoom-controls" style="display: flex; gap: 0.5rem; align-items: center;">
                                    <button class="btn btn-ghost" id="zoom-out" style="padding: 2px 8px;">-</button>
                                    <span id="zoom-level"
                                        style="font-size: 0.9rem; min-width: 40px; text-align: center;">100%</span>
                                    <button class="btn btn-ghost" id="zoom-in" style="padding: 2px 8px;">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="diff-container">
                            <!-- Left PDF -->
                            <div class="pdf-viewer-container">
                                <div class="pdf-controls">
                                    <span id="pdf-filename-left" class="status-text"></span>
                                    <span class="diff-removed"
                                        style="text-decoration: none; font-size: 0.75rem;">显示删除</span>
                                </div>
                                <div class="pdf-viewer pdf-stage" id="pdf-viewer-left">
                                    <div id="pdf-pages-left"></div>
                                    <div class="pdf-placeholder" id="pdf-placeholder-left"
                                        style="display: flex; height: 100%; align-items: center; justify-content: center; color: var(--text-muted);">
                                        <p>等待处理...</p>
                                    </div>
                                </div>
                            </div>

                            <!-- Right PDF -->
                            <div class="pdf-viewer-container">
                                <div class="pdf-controls">
                                    <span id="pdf-filename-right" class="status-text"></span>
                                    <span class="diff-added"
                                        style="text-decoration: none; font-size: 0.75rem;">显示新增</span>
                                </div>
                                <div class="pdf-viewer pdf-stage" id="pdf-viewer-right">
                                    <div id="pdf-pages-right"></div>
                                    <div class="pdf-placeholder" id="pdf-placeholder-right"
                                        style="display: flex; height: 100%; align-items: center; justify-content: center; color: var(--text-muted);">
                                        <p>等待处理...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Diff Text Details (Hidden by default or secondary) -->
                <section class="diff-section" id="diff-section" style="display: none; margin-top: 2rem;">
                    <!-- Content preserved for functionality but could be hidden/toggled -->
                    <div class="glass-panel" style="padding: 1.5rem;">
                        <h3 style="margin-bottom: 1rem; color: var(--text-secondary);">调试/文本视图</h3>
                        <div class="diff-container">
                            <div class="diff-pane">
                                <div class="panel-content pane-content" id="diff-left"></div>
                            </div>
                            <div class="diff-pane">
                                <div class="panel-content pane-content" id="diff-right"></div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Right Sidebar -->
            <aside class="workspace-sidebar">
                <div class="sidebar-header glass-panel">
                    <h3>比对结果</h3>
                    <div class="similarity-score">
                        <span class="score-label">相似度</span>
                        <span class="score-value">--%</span>
                    </div>
                </div>

                <div class="stats-summary glass-panel" id="stats-section">
                    <div class="stat-row">
                        <span class="stat-label">总差异点</span>
                        <span class="stat-value highlight" id="stat-total">0</span>
                    </div>
                    <div class="stat-grid">
                        <div class="tiny-stat added">
                            <span class="label">新增</span>
                            <span class="value" id="stat-added">0</span>
                        </div>
                        <div class="tiny-stat removed">
                            <span class="label">删除</span>
                            <span class="value" id="stat-removed">0</span>
                        </div>
                        <div class="tiny-stat modified">
                            <span class="label">修改</span>
                            <span class="value" id="stat-modified">0</span>
                        </div>
                    </div>
                    <div class="unmapped-notice" id="unmapped-notice" style="display: none;">
                        <span id="unmapped-count">0</span> 个差异无法定位到原件
                    </div>
                </div>

                <div class="diff-list-container glass-panel">
                    <div class="list-header">
                        <h4>差异列表</h4>
                        <div class="filter-tabs">
                            <span class="active">全部</span>
                            <span>新增</span>
                            <span>删除</span>
                        </div>
                    </div>
                    <div class="diff-list-scroll-area" id="diff-list-content">
                        <!-- Dynamic content populated by JS -->
                        <div class="empty-state">暂无差异数据</div>
                    </div>
                </div>
            </aside>
        </main>

        <footer style="margin-top: 3rem; text-align: center; color: var(--text-muted); padding: 1rem;">
            <p>&copy; 2026 Contract Diff Intelligence. All rights reserved.</p>
        </footer>
    </div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
